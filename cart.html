<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shopping Cart — Buy &amp; Bye</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Buyer navigation: links sa profile, orders, at logout. -->
<div class="topbar">
  <div class="container">
    <a href="orders.html">Track My Orders</a>
    <a href="account.html">My Profile</a>
    <button type="button" class="topbar-action" data-logout>Sign out</button>
  </div>
</div>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="logo">Buy &amp; Bye<span class="brand-byline">by Jasper Clarence</span></a>
    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Search products, brands, and more" autocomplete="off" />
      <button type="submit" aria-label="Search"><i data-lucide="search"></i></button>
    </form>
    <div class="nav-icons">
      <a href="cart.html" class="cart-link" aria-label="Cart">
        <i data-lucide="shopping-cart"></i>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <a href="orders.html" class="nav-text-link">My Orders</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="container">
    <h2 class="section-title">Shopping Cart</h2>

    <!-- Dito ipinapakita ng script.js ang cart items at totals. -->
    <div id="cartContent">
      <table class="cart-table" id="cartTable">
        <thead>
          <tr>
            <th>Product</th>
            <th>Unit Price</th>
            <th>Quantity</th>
            <th>Subtotal</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cartTbody"></tbody>
      </table>

      <div class="cart-summary">
        <span class="total-label">Total (<span id="cartItemCount">0</span> item(s)):</span>
        <span class="total-value" id="cartTotal">₱0.00</span>
        <a href="checkout.html" class="btn btn-primary" id="checkoutBtn">Proceed to Checkout</a>
      </div>
    </div>

    <!-- Ipakita ito kapag walang laman ang cart. -->
    <div class="empty-state" id="cartEmptyState" style="display:none;">
      <div class="icon"><i data-lucide="shopping-cart"></i></div>
      <p>Your cart is empty.</p>
      <br />
      <a href="index.html" class="btn btn-primary">Start Shopping</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  Buy &amp; Bye — a front-end only demo store. Not a real e-commerce platform.
</footer>

<!-- I-load ang icons, shared data, at buyer-side page behavior. -->
<script src="https://unpkg.com/lucide@latest"></script>
<script src="store.js"></script>
<script src="script.js"></script>
</body>
</html>
