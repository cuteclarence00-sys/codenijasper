<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seller Profile — Buy &amp; Bye</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Public seller page: links pabalik sa shop at buyer pages. -->
<div class="topbar">
  <div class="container">
    <a href="index.html">Shop</a>
    <a href="seller-profile.html">Seller profile</a>
    <a href="orders.html">My Orders</a>
    <button type="button" class="topbar-action" data-logout>Sign out</button>
  </div>
</div>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="logo">Buy &amp; Bye<span class="brand-byline">by Jasper Clarence</span></a>
    <div class="nav-icons">
      <a href="cart.html" class="cart-link" aria-label="Cart">
        <i data-lucide="shopping-cart"></i>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <a href="orders.html" class="nav-text-link">My Orders</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="container">
    <!-- Seller details at reviews ay binabasa mula sa store data. -->
    <section class="public-seller-profile" aria-labelledby="sellerProfileName">
      <img src="seller-photo.jpg" alt="Jasper Clarence Ramos" class="public-seller-avatar" />
      <div>
        <p class="public-seller-label">Buy &amp; Bye seller</p>
        <h1 id="sellerProfileName">Jasper Clarence Ramos</h1>
        <p class="public-seller-location">Based in Tondo, Manila, Philippines</p>
        <div id="sellerReviewSummary" class="seller-review-summary" aria-live="polite"></div>
      </div>
    </section>
    <section class="seller-public-reviews" aria-labelledby="sellerReviewsHeading">
      <h2 id="sellerReviewsHeading" class="section-title">Buyer reviews</h2>
      <div id="sellerPublicReviews"></div>
    </section>
  </div>
</main>

<footer class="site-footer">
  Buy &amp; Bye · Seller profile
</footer>

<!-- I-load ang icons, shared data, at seller profile display. -->
<script src="https://unpkg.com/lucide@latest"></script>
<script src="store.js"></script>
<script src="script.js"></script>
</body>
</html>
