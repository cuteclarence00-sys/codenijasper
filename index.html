<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buy &amp; Bye — Online Shopping</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Buyer navigation: links sa profile at orders, search, at logout. -->
<div class="topbar">
  <div class="container">
    <a href="orders.html">Track My Orders</a>
    <a href="account.html">My Profile</a>
    <button type="button" class="topbar-action" data-logout>Sign out</button>
  </div>
</div>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="logo">Buy &amp; Bye<span class="brand-byline">by Jasper Clarence</span></a>
    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Search products, brands, and more" autocomplete="off" />
      <button type="submit" aria-label="Search"><i data-lucide="search"></i></button>
    </form>
    <div class="nav-icons">
      <a href="cart.html" class="cart-link" aria-label="Cart">
        <i data-lucide="shopping-cart"></i>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <a href="orders.html" class="nav-text-link">My Orders</a>
    </div>
  </div>
</header>

<!-- Pinupuno ng script.js ang categories dito base sa available products. -->
<nav class="category-bar">
  <div class="container" id="categoryBar">
    <!-- Ipinapakita rito ang category links. -->
  </div>
</nav>

<main class="page">
  <div class="container">
    <!-- Seller profile link at product cards ng store. -->
    <a class="seller-home-link" href="seller-profile.html">
      <img src="seller-photo.jpg" alt="" />
      <span><strong>Meet Jasper Clarence Ramos</strong><small>Buy &amp; Bye seller · Tondo, Manila · Read buyer reviews</small></span>
      <span aria-hidden="true">View profile &rarr;</span>
    </a>
    <h2 class="section-title" id="resultsTitle">All Products</h2>
    <!-- Lalabas dito ang filtered product cards. -->
    <div class="product-grid" id="productGrid">
    </div>
    <!-- Ipapakita kapag walang product na match sa search o category. -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="icon"><i data-lucide="search-x"></i></div>
      <p>No products match your search.</p>
    </div>
  </div>
</main>

<footer class="site-footer">
  Buy &amp; Bye — a front-end only demo store. Not a real e-commerce platform.
</footer>

<!-- I-load ang shared data, icons, at buyer-side page behavior. -->
<script src="https://unpkg.com/lucide@latest"></script>
<script src="store.js"></script>
<script src="script.js"></script>
</body>
</html>
