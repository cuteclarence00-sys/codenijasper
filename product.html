<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Details — Buy &amp; Bye</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Buyer navigation: links sa profile, search, cart, orders, at logout. -->
<div class="topbar">
  <div class="container">
    <a href="orders.html">Track My Orders</a>
    <a href="account.html">My Profile</a>
    <button type="button" class="topbar-action" data-logout>Sign out</button>
  </div>
</div>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="logo">Buy &amp; Bye<span class="brand-byline">by Jasper Clarence</span></a>
    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Search products, brands, and more" autocomplete="off" />
      <button type="submit" aria-label="Search"><i data-lucide="search"></i></button>
    </form>
    <div class="nav-icons">
      <a href="cart.html" class="cart-link" aria-label="Cart">
        <i data-lucide="shopping-cart"></i>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <a href="orders.html" class="nav-text-link">My Orders</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="container">
    <!-- Pinipili ang product gamit ang ID sa URL at ipinapakita ng script.js ang details nito. -->
    <p class="breadcrumb"><a href="index.html">Home</a> &rsaquo; <span id="breadcrumbName">Product</span></p>
    <a class="seller-home-link product-seller-link" href="seller-profile.html">
      <img src="seller-photo.jpg" alt="" />
      <span><strong>Sold by Jasper Clarence Ramos</strong><small>Tondo, Manila · See seller profile and buyer reviews</small></span>
      <span aria-hidden="true">View profile &rarr;</span>
    </a>
    <div id="productDetailWrap"><!-- Dito ilalagay ng script.js ang product details. --></div>
  </div>
</main>

<footer class="site-footer">
  Buy &amp; Bye — a front-end only demo store. Not a real e-commerce platform.
</footer>

<!-- I-load ang icons, shared data, at buyer-side page behavior. -->
<script src="https://unpkg.com/lucide@latest"></script>
<script src="store.js"></script>
<script src="script.js"></script>
</body>
</html>
